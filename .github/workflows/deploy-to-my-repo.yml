name: Deploy custom Jellyfin

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cube-custom
        uses: actions/checkout@v4
        with:
          ref: cube-custom

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Verify source-labelled rating sync
        run: |
          python -m unittest discover -s tests -p test_source_ratings.py -v
          python -m compileall -q jellyfin_kodi

      - name: Create custom build version
        id: metadata
        shell: bash
        run: |
          python3 <<'EOF'
          import os
          import re
          from pathlib import Path

          path = Path("release.yaml")
          text = path.read_text(encoding="utf-8")

          match = re.search(
              r"^version:\s*['\"]?([^'\"\n]+)['\"]?",
              text,
              re.MULTILINE
          )

          if not match:
              raise RuntimeError("Could not find version in release.yaml")

          upstream_version = match.group(1).strip()
          run_number = os.environ["GITHUB_RUN_NUMBER"]

          custom_version = f"{upstream_version}.{run_number}"

          new_text = re.sub(
              r"^version:\s*['\"]?[^'\"\n]+['\"]?",
              f"version: '{custom_version}'",
              text,
              count=1,
              flags=re.MULTILINE
          )

          path.write_text(new_text, encoding="utf-8")

          print(f"Upstream version: {upstream_version}")
          print(f"Custom base version: {custom_version}")
          print(f"Kodi addon version: {custom_version}+py3")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"upstream_version={upstream_version}\n")
              f.write(f"base_version={custom_version}\n")
              f.write(f"addon_version={custom_version}+py3\n")
          EOF

      - name: Build Jellyfin addon
        run: |
          python build.py --version py3

      - name: Verify build
        shell: bash
        run: |
          test -f addon.xml
          test -f plugin.video.jellyfin+py3.zip

          echo "Generated addon.xml:"
          grep '<addon ' addon.xml

          echo "Generated ZIP:"
          ls -lh plugin.video.jellyfin+py3.zip

      - name: Prepare repository package
        id: package
        shell: bash
        run: |
          ADDON_ID="plugin.video.jellyfin"
          VERSION="${{ steps.metadata.outputs.addon_version }}"
          ZIP_NAME="${ADDON_ID}-${VERSION}.zip"

          mv plugin.video.jellyfin+py3.zip "${ZIP_NAME}"

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

          echo "Repository ZIP: ${ZIP_NAME}"

      - name: Clone my Kodi repository
        env:
          REPO_PAT: ${{ secrets.REPO_SILVO_PAT }}
        run: |
          git clone \
            --branch cube-custom \
            "https://x-access-token:${REPO_PAT}@github.com/IkHadHonger/repository.silvo.git" \
            repo-silvo

          cd repo-silvo

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy Jellyfin to Piers channel
        shell: bash
        run: |
          ADDON_ID="plugin.video.jellyfin"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          DEST="repo-silvo/piers/${ADDON_ID}"

          mkdir -p "${DEST}/resources"

          rm -f "${DEST}/${ADDON_ID}-"*.zip

          cp "${ZIP_NAME}" "${DEST}/"
          cp addon.xml "${DEST}/addon.xml"

          cp resources/icon.png "${DEST}/resources/icon.png"
          cp resources/fanart.png "${DEST}/resources/fanart.png"

          echo "Deployed ${ADDON_ID}"
          echo "Version: ${{ steps.metadata.outputs.addon_version }}"
          echo "ZIP: ${ZIP_NAME}"

      - name: Generate repository metadata
        run: |
          cd repo-silvo
          python3 _repo_generator.py

      - name: Commit and push repository
        run: |
          cd repo-silvo

          git add .

          if git diff --staged --quiet; then
            echo "No repository changes"
          else
            git commit \
              -m "Deploy custom Jellyfin ${{ steps.metadata.outputs.addon_version }}" \
              -m "Source: ${{ github.repository }}@${{ github.sha }}"

            git push origin cube-custom
          fi

      - name: Summary
        run: |
          echo "## Custom Jellyfin deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Addon: plugin.video.jellyfin" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream: ${{ steps.metadata.outputs.upstream_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.metadata.outputs.addon_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: ${{ steps.package.outputs.zip_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: repository.silvo / cube-custom / piers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dolby Vision FEL/MEL patch included" >> "$GITHUB_STEP_SUMMARY"
